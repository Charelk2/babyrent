<span class="material-symbols-outlined" data-icon="Eye">visibility</span>

<span>Google</span>

</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const loginRadio = document.getElementById('login-radio');
        const registerRadio = document.getElementById('register-radio');
        const forgotPasswordLink = document.getElementById('forgot-password-link');
        const submitBtn = document.getElementById('submit-btn');

        function updateUI() {
            if (registerRadio.checked) {
                // Register State
                forgotPasswordLink.style.display = 'none';
                submitBtn.textContent = 'Create Account';
            } else {
                // Login State
                forgotPasswordLink.style.display = 'block';
                submitBtn.textContent = 'Login';
            }
        }

        // Event Listeners
        loginRadio.addEventListener('change', updateUI);
        registerRadio.addEventListener('change', updateUI);

        // Initial check
        updateUI();
    });
</script>
</body></html>
